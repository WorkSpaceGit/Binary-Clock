<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Binary Clock</title>
  <style>
    :root {
      --bit-size: calc(min(15vw, 10vh));
      --gap: calc(var(--bit-size) / 4);
    }

    body {
      background: #191919;
      color: #0f0;
      font-family: sans-serif;
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { 
      color: #0f0; 
      margin-bottom: calc(var(--gap) * 2);
      font-size: calc(var(--bit-size) * 0.8);
    }

    .clock {
      display: flex;
      gap: calc(var(--gap) * 2);
      align-items: flex-end;
    }

    .digit-column {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: var(--gap);
      align-items: center;
    }

    .bit {
      width: var(--bit-size);
      height: var(--bit-size);
      background: #222;
      border: calc(var(--bit-size) * 0.05) solid #333;
      border-radius: 15%;
      transition: background-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
      will-change: background-color, box-shadow;
      contain: paint;
    }

    .bit.on {
      background-color: #0f0;
      box-shadow: 0 0 calc(var(--bit-size) * 0.3) #0f0;
    }

    .spacer { 
      width: var(--bit-size); 
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="clock" id="c"></div>
  </div>

  <script>
    // === Binary Clock Hybrid Pro ===

    // --- favicon (оновлено, гарантовано працює у всіх браузерах) ---
    (function setFavicon() {
      const existing = document.querySelector('link[rel="icon"]');
      if (existing) existing.remove();

      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, 64, 64);
      ctx.font = "bold 48px monospace";
      ctx.fillStyle = "#0f0";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("∞", 32, 35);

      const link = document.createElement('link');
      link.rel = 'icon';
      link.type = 'image/png';
      link.href = canvas.toDataURL('image/png');
      document.head.appendChild(link);
    })();

    // --- побудова DOM (з твоєї версії, структурно чисто) ---
    const bitLengths = [2, 4, 3, 4, 3, 4];
    const clockElement = document.getElementById('c');
    const bitRefs = [];
    const bitState = [];

    function createBitColumn(length) {
      const col = document.createElement('div');
      col.className = 'digit-column';

      const bits = [];
      const state = Array(length).fill(false);

      for (let i = 0; i < length; i++) {
        const bit = document.createElement('div');
        bit.className = 'bit';
        bit.setAttribute('aria-hidden', 'true'); // accessibility
        col.appendChild(bit);
        bits.push(bit);
      }

      return { column: col, bits, state };
    }

    bitLengths.forEach((length, index) => {
      const result = createBitColumn(length);
      clockElement.appendChild(result.column);
      bitRefs[index] = result.bits;
      bitState[index] = result.state;

      if (index === 1 || index === 3) {
        const spacer = document.createElement('div');
        spacer.className = 'spacer';
        clockElement.appendChild(spacer);
      }
    });

    // --- оновлення годинника (з твоєї версії, синхронізований setTimeout) ---
    function updateClock() {
      const now = Date.now();
      const time = new Date(now);

      const digits = [
        Math.floor(time.getHours() / 10),
        time.getHours() % 10,
        Math.floor(time.getMinutes() / 10),
        time.getMinutes() % 10,
        Math.floor(time.getSeconds() / 10),
        time.getSeconds() % 10
      ];

      digits.forEach((digit, i) => {
        const bin = digit.toString(2).padStart(bitLengths[i], '0');
        for (let j = 0; j < bitLengths[i]; j++) {
          const isOn = bin[j] === '1';
          if (bitState[i][j] !== isOn) {
            bitState[i][j] = isOn;
            bitRefs[i][j].classList.toggle('on', isOn);
          }
        }
      });

      const delay = 1000 - (now % 1000);
      setTimeout(updateClock, delay);
    }

    // --- адаптивність (з твоєї версії: чисто через CSS, але fallback для старих браузерів) ---
    function handleResize() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const size = Math.min(vw / 15, vh / 10);
      document.documentElement.style.setProperty('--bit-size', `${size}px`);
    }

    window.addEventListener('resize', () => {
      clearTimeout(window._resizeTimer);
      window._resizeTimer = setTimeout(handleResize, 120);
    });
    handleResize();

    // --- запуск годинника ---
    updateClock();
  </script>
</body>
</html>
