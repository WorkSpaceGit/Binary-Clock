<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#191919">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Binary Clock">
  <title>Binary Clock</title>
  <style>
    :root {
      --bit-size: min(15vw, 10vh);
      --gap: calc(var(--bit-size) / 4);
      --color-off: #222;
      --color-on: #0f0;
      --border-off: #2a2a2a;
      --border-on: #0f0;
    }

    body {
      background: #191919;
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100svh;
      width: 100vw;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .clock {
      display: flex;
      gap: calc(var(--gap) * 2);
      align-items: flex-end;
    }

    .digit-column {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: var(--gap);
      align-items: center;
    }

    .bit {
      width: var(--bit-size);
      height: var(--bit-size);
      border-radius: 15%;
      background: var(--color-off);
      border: calc(var(--bit-size) * 0.06) solid var(--border-off);
      contain: paint;
    }

    .bit.on {
      background: var(--color-on);
      border-color: var(--border-on);
    }

    .spacer {
      width: var(--bit-size);
    }
  </style>
</head>
<body>
  <div class="clock" id="c" role="timer" aria-label="Бінарний годинник"></div>

  <script>
    // --- іконка (favicon + PWA apple-touch-icon) ---
    function makeIconDataURL(size) {
      const cv = document.createElement('canvas');
      cv.width = cv.height = size;
      const cx = cv.getContext('2d');
      cx.fillStyle = '#191919';
      cx.fillRect(0, 0, size, size);
      cx.font = `bold ${size * 0.72}px monospace`;
      cx.fillStyle = '#0f0';
      cx.textAlign = 'center';
      cx.textBaseline = 'middle';
      cx.fillText('∞', size / 2, size * 0.54);
      return cv.toDataURL('image/png');
    }

    const icon192 = makeIconDataURL(192);

    (function setupIcons() {
      const favicon = document.createElement('link');
      favicon.rel = 'icon';
      favicon.type = 'image/png';
      favicon.href = makeIconDataURL(64);
      document.head.appendChild(favicon);

      const apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = icon192;
      document.head.appendChild(apple);
    })();

    // --- PWA manifest (inline via Blob URL) ---
    (function setupManifest() {
      const iconData = icon192;
      const manifest = {
        name: 'Binary Clock',
        short_name: 'BinClock',
        display: 'fullscreen',
        orientation: 'portrait',
        background_color: '#191919',
        theme_color: '#191919',
        icons: [{ src: iconData, sizes: '192x192', type: 'image/png' }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    })();

    // --- Service Worker (inline via Blob URL) ---
    (function setupServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      const swCode = `
        const CACHE = 'binclock-v1';
        self.addEventListener('install', e => {
          self.skipWaiting();
        });
        self.addEventListener('activate', e => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener('fetch', e => {
          e.respondWith(
            caches.match(e.request).then(r => r || fetch(e.request).catch(() => new Response('', { status: 503 })))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob));
    })();

    // --- Screen Wake Lock ---
    let wakeLock = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch (_) {}
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    requestWakeLock();

    // --- побудова DOM ---
    const bitLengths = [2, 4, 3, 4, 3, 4];
    const clockEl = document.getElementById('c');
    const bitRefs = [];
    const bitState = [];

    bitLengths.forEach((len, i) => {
      const col = document.createElement('div');
      col.className = 'digit-column';
      const bits = [];

      for (let j = 0; j < len; j++) {
        const bit = document.createElement('div');
        bit.className = 'bit';
        bit.setAttribute('aria-hidden', 'true');
        col.appendChild(bit);
        bits.push(bit);
      }

      clockEl.appendChild(col);
      bitRefs[i] = bits;
      bitState[i] = Array(len).fill(false);

      if (i === 1 || i === 3) {
        const spacer = document.createElement('div');
        spacer.className = 'spacer';
        clockEl.appendChild(spacer);
      }
    });

    // --- оновлення годинника ---
    function updateClock() {
      const now = new Date();
      const digits = [
        Math.floor(now.getHours() / 10),
        now.getHours() % 10,
        Math.floor(now.getMinutes() / 10),
        now.getMinutes() % 10,
        Math.floor(now.getSeconds() / 10),
        now.getSeconds() % 10
      ];

      digits.forEach((digit, i) => {
        const len = bitLengths[i];
        for (let j = 0; j < len; j++) {
          const isOn = ((digit >> (len - 1 - j)) & 1) === 1;
          if (bitState[i][j] !== isOn) {
            bitState[i][j] = isOn;
            bitRefs[i][j].className = isOn ? 'bit on' : 'bit';
          }
        }
      });

      setTimeout(updateClock, 1000 - (Date.now() % 1000));
    }

    requestAnimationFrame(updateClock);
  </script>
</body>
</html>
